# Runs the test suite on every push and pull request. Tests only:
# this workflow never rebuilds data, never writes to data/, and never
# touches data/predictions/ locks. The suite itself makes no live
# network calls (fixtures only).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Full history: pipeline/tests/test_build_info_fresh.py compares
      # data/build_info.json against HEAD and HEAD~1, which a shallow
      # clone cannot resolve.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt playwright
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: pytest
